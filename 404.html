<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Сторінку не знайдено — Happy Finance</title>
<link rel="icon" type="image/png" sizes="32x32" href="/finance/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#102662;--orange:#FB6835;--ink:#121521}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 70% at 78% 20%,rgba(251,104,53,.35),transparent 70%),radial-gradient(60% 70% at 15% 90%,rgba(54,92,255,.35),transparent 70%),var(--ink);color:#fff;font-family:Raleway,system-ui,sans-serif;text-align:left}
main{max-width:620px}
.code{font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(5rem,22vw,10rem);line-height:.9;color:transparent;-webkit-text-stroke:2px var(--orange)}
h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(1.5rem,5vw,2.4rem);text-transform:uppercase;margin:18px 0 12px;line-height:1.1}
p{font-size:1.05rem;line-height:1.6;opacity:.8;margin-bottom:28px}
a.b{display:inline-block;padding:16px 28px;background:var(--orange);color:#fff;font-family:Montserrat,sans-serif;font-weight:700;text-decoration:none}
a.b:hover{background:#ff7a4d}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Тут цифри не зійшлися</h1>
  <p>Такої сторінки немає. Можливо, посилання застаріло. Повернімось на головну, там усе на місці.</p>
  <a class="b" id="home" href="/finance/">На головну</a>
</main>
<script>if(!/github\.io$/.test(location.hostname))document.getElementById('home').href='/';</script>
</body>
</html>
